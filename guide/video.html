<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=1320px">
	<title>KOK_Video</title>
	<link rel="shortcut icon" href="/assets/img/favicon.png" type="image/x-icon">

	 <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
    />

	<!-- 외부 css 연결 -->
	<link href="./css/videostyle.css" rel="stylesheet" type="text/css">

</head>

<body>
	<!-- video 페이지 -->

	<!-- Swiper -->
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">

        <div class="swiper-slide">
			<video class="logomotion" src="./video/KOK_intro.mp4" autoplay muted loop playsinline></video>
		</div>

        <div class="swiper-slide">
			<video class="brandmotion" src="./video/brand_story.mp4" autoplay muted loop playsinline></video>
		</div>
      </div>

      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>

	
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper('.mySwiper', {
        cssMode: true,
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
        pagination: {
          el: '.swiper-pagination',
        },
        mousewheel: true,
        keyboard: true,
      });
    </script>

	<div class="back fixed2">
		<a href="../index.html#projects" onclick="window.close()"><img src="images/back.png" alt="back"></a>
	</div>

	<script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.4.3/jquery.min.js"></script>
	<script src="js/jquery-1.12.3.js"></script>
	<script src="js/sub_script.js"></script>
</body>

</html>
